<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <h1>Declaring a variable const</h1>
    <p id="demo"></p>

    <script>
    const x = 10;
    {
      // x = 2; // this will not print anything because const

      try {
        x = 2;
      } catch (e) {
        console.error("Error: ", e.message);
      }

    }

    document.getElementById("demo").innerHTML = x;
    </script>
  </body>
</html>
