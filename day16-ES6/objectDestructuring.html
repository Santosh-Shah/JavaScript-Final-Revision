<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <h1>JavaScript Operators</h1>
    <h2>Object Destructuring</h2>

    <p id="demo"></p>

    <script>
    const person = {
      firstName: "Samir",
      lastName: "Paudel",
      age: 45,
      eyeColor: "blue"
    };

    let {firstName, eyeColor} = person;

    document.getElementById("demo").innerHTML = firstName + " you are so cute because you have a " + eyeColor + " colored eye";
  </script>
  </body>
</html>
